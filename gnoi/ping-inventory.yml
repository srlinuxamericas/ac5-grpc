all:
  children:
    nokia_switches:
      hosts:
        leaf1:
          ansible_host: leaf1
        spine:
          ansible_host: spine
      vars:
        gnoi_port: 57400
        gnoi_user: admin
        gnoi_pass: "{{ lookup('env', 'EVENT_PASSWORD') }}"
        ping_targets:
          - { ip: "2.2.2.2", vrf: "default" }
          - { ip: "192.168.20.2", vrf: "default" }
          - { ip: "10.46.2.42", vrf: "default" }
